name: Generate coding-agent shrinkwrap

on:
  push:
    branches: [fix/model-fallback-and-shrinkwrap]
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/coding-agent/**"
      - "scripts/generate-coding-agent-shrinkwrap.mjs"
      - ".github/workflows/generate-coding-agent-shrinkwrap.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Generate shrinkwrap
        run: npm run shrinkwrap:coding-agent

      - name: Prepare generated shrinkwrap artifact
        run: |
          test -f packages/terminal-ui/npm-shrinkwrap.json
          mkdir -p artifact
          cp packages/terminal-ui/npm-shrinkwrap.json artifact/npm-shrinkwrap.json
          ls -lh artifact/npm-shrinkwrap.json

      - name: Upload generated shrinkwrap
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-shrinkwrap
          path: artifact/npm-shrinkwrap.json
          if-no-files-found: error
          retention-days: 3
